name: chainx

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: chainx-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
      EXT_ENABLED: ${EXT_ENABLED:-false}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - chainx_net

  postgres:
    image: postgres:16-alpine
    container_name: chainx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sih}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sih}
      POSTGRES_DB: ${POSTGRES_DB:-sih26183}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sih} -d ${POSTGRES_DB:-sih26183}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chainx_net

  redis:
    image: redis:7-alpine
    container_name: chainx-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chainx_net

  neo4j:
    image: neo4j:5
    container_name: chainx-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-sih26183}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neodat:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-sih26183} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - chainx_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: chainx-frontend
    profiles: ["demo"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    networks:
      - chainx_net

networks:
  chainx_net:
    driver: bridge

volumes:
  pgdata:
  neodat:
