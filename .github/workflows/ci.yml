name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip && pip install "ruff>=0.6.0"
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/
  import-check:
    name: Import smoke (app can boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip && pip install -e .
      - run: |
          python -c "from app.main import create_app; create_app(); print('app OK')"
          python -c "from app.providers.demo import DemoBlockchainProvider; print('demo OK')"
          python -c "from app.engine.attribution import freezability; print('engine OK')"
          python -c "from app.core.security import create_access_token; print('security OK')"
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: sih, POSTGRES_PASSWORD: sih26183, POSTGRES_DB: chainx_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DEMO_MODE: "true"
      EXT_ENABLED: "false"
      SECRET_KEY: ci-test-secret
      POSTGRES_HOST: localhost
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" || pip install -e .
      - run: pytest -q
